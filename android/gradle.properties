org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# The Go server the app talks to. 10.0.2.2 is your computer as seen from the Android emulator;
# for a real phone on the same Wi-Fi use your computer's LAN address, e.g. http://192.168.0.10:8080
cardify.apiUrl=http://192.168.0.7:8080
# Must match CARDIFY_TOKEN on the server. Put the real one in ~/.gradle/gradle.properties, which overrides this and stays out of git.
cardify.token=change-me

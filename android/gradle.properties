org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# The Go server the app talks to (deployed on Vercel). For a server on your own computer instead:
# http://10.0.2.2:8080 from the emulator, or http://<computer LAN IP>:8080 from a phone on the same Wi-Fi.
cardify.apiUrl=https://cardify-umber-delta.vercel.app
# Must match CARDIFY_TOKEN on the server. Put the real one in ~/.gradle/gradle.properties, which overrides this and stays out of git.
cardify.token=change-me
